<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>Wakfu Mémo</title>
<link rel="stylesheet" href="coque.css">
</head>
<!--
  `spellcheck="false"` sur tout le document : les Consignes sont des noms de
  sorts et des abréviations de donjon — « gobgob », « TP SUR HUPPER », « oeil de
  taupe » — et le correcteur les soulignait à peu près toutes.
-->
<body spellcheck="false">
  <!--
    La Fenêtre principale, la seule des trois surfaces qui soit une fenêtre.

    Le squelette seulement : `coque.js` peint la colonne, le Socle d'état et
    l'écran courant à chaque message du processus principal. Trois choses tiennent
    ce fichier, et aucune n'est cosmétique :

    - la COLONNE est permanente, et c'est sa place en pied qui rend le Socle
      d'état possible — une barre d'onglets n'aurait eu la place que d'une
      pastille et de six mots (ADR 0012) ;
    - le SOCLE est le seul endroit de l'app qui explique pourquoi l'Overlay ne se
      dessine pas. L'ADR 0006 retire ce vocabulaire à l'Overlay, pas à l'app ;
    - le BANDEAU de la persistance vit au-dessus de tout : un fichier mis de côté
      se dit avant qu'on cherche ses données (ADR 0004).
  -->
  <p class="alerte" id="alerte" hidden></p>

  <div class="coque">
    <nav class="rail">
      <div class="brand">Wakfu Mémo</div>
      <div class="items" id="entrees"></div>
      <div class="grow"></div>
      <div class="socle" id="socle"></div>
    </nav>
    <main class="scr" id="ecran"></main>
  </div>

  <!-- Les calques : le menu d'une ligne, le panneau d'un Emplacement, la
       confirmation. Hors du flux, parce que les deux premiers débordent ce qui
       les ouvre — la colonne serrée n'a la place ni de l'un ni de l'autre. -->
  <div id="calques"></div>

  <script type="module" src="coque.js"></script>
</body>
</html>
