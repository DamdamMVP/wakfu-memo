<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PROTOTYPE — La coque de la Fenêtre principale et l'écran des Strats (#21)</title>
<!--
  PROTOTYPE JETABLE — ticket #21.

  DEUX AXES, combinables librement :
    ?coque=A|B|C    la coque de la Fenetre principale — comment on passe d'un
                    ecran a l'autre, et ou vivent l'interrupteur d'Affichage
                    demande et l'onboarding.
      A  onglets en haut
      B  colonne laterale, avec un socle d'etat en pied
      C  ecran d'accueil : aucune navigation permanente
    ?strats=1|2|3   l'ecran des Strats — le rapport entre la LISTE et
                    l'EDITEUR de #5.
      1  liste plein ecran, puis descente dans la strat
      2  deux volets : la liste a gauche, l'editeur a droite
      3  la liste EST la relecture : chaque strat est un bloc qu'on deplie

  La barre du bas change les deux ; le clavier aussi (gauche/droite = la coque,
  haut/bas = l'ecran des Strats). Rien n'est persiste.

  CE QUI EST FIGE AILLEURS, ET QU'ON NE REDISCUTE PAS ICI :
    - #5  l'INTERIEUR d'une Strat : une fiche par Tour, en-tete « T1 » plus
          description globale, une ligne par Emplacement, note ambre en pied,
          composition en colonne verticale dont l'ordre est le Rang, icone de
          classe carree avec lisere de Couleur 3 px colle a son bord gauche.
          Reproduit tel quel ici — c'est le decor contre lequel la coque se juge,
          pas une proposition.
    - #7  liste PLATE, noms LIBRES, choix de la Strat collant et persiste.
    - #11 les noms ne sont PAS uniques (dupliquer est un geste attendu) ; une
          suppression annonce le compte de ce qui part.
    - #16 trois surfaces, une seule est une fenetre ; le ✕ n'existe que sur la
          Fenetre principale, et il quitte tout.
    - #17 l'onboarding EXPLIQUE, il ne constitue rien. Cinq ecrans, passable,
          rejouable. Ses MOTS sont hors perimetre : les libelles ci-dessous
          sont du remplissage assume.
    - #18 relire une strat entiere se fait ICI, l'Overlay refusant de feuilleter
          ses Tours hors combat. D'ou la variante 3.
    - ADR 0006 : si aucune Strat n'est choisie, l'Overlay NE SE DESSINE PAS.
          C'est donc cet ecran, et lui seul, qui doit donner envie d'en creer une.

  LES ECRANS ROSTER ET REGLAGES SONT VOLONTAIREMENT VIDES : ils appartiennent
  a #22 et #23. Les maquetter ici les prejugerait. La coque doit seulement
  montrer qu'on y va.
-->
<style>
  /* Jetons visuels repris tels quels des prototypes de #5, #6 et #16 : on ne
     juge pas une coque sur une autre palette que celle qui est deja retenue. */
  :root {
    --bg:#0f1115; --panel:#171a21; --panel-2:#1d212a; --raise:#232833;
    --line:#2b3140; --line-2:#363d4d;
    --txt:#e8eaef; --dim:#8b93a3; --faint:#5c6474;
    --accent:#5b8cff; --ok:#3fc07a; --note:#e0b070; --bad:#ef5350;
  }
  * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#39404f #0f1115; }
  html,body { height:100%; }
  body { margin:0; background:#07080a; color:var(--txt);
    font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; overflow:hidden; }
  button { font:inherit; color:var(--txt); background:var(--raise);
    border:1px solid var(--line-2); border-radius:8px; padding:5px 11px;
    cursor:pointer; transition:.12s border-color,.12s background; text-align:left; }
  button:hover { border-color:var(--accent); background:#283040; }
  button.ghost { background:transparent; border-color:transparent; color:var(--dim); }
  button.ghost:hover { background:var(--raise); color:var(--txt); }
  button.danger:hover { border-color:var(--bad); background:#3a1f1f; }
  input { font:inherit; color:var(--txt); background:#0c0e12;
    border:1px solid var(--line); border-radius:7px; padding:4px 8px; }
  input:focus { outline:none; border-color:var(--accent); }
  ::placeholder { color:var(--faint); }
  [contenteditable] { outline:none; border-radius:5px; }
  [contenteditable]:focus { box-shadow:0 0 0 2px #5b8cff55; }
  [contenteditable]:empty:before { content:attr(data-ph); color:var(--faint); }

  .ribbon { background:#3a2c10; color:#f0cf94; text-align:center; padding:3px 8px;
    font-size:11.5px; letter-spacing:.4px; flex:none; }

  /* --------------------------------------------------------- la scene ---- */
  /* La Fenetre principale est une VRAIE FENETRE : ses proportions comptent.
     La telecommande est donc en bas, hors du cadre, et pas dans un panneau
     lateral qui volerait de la largeur a l'ecran qu'on juge. */
  .stage { flex:1; min-height:0; display:grid; place-items:center; padding:14px; }
  .win { width:min(1180px,97vw); height:100%; max-height:760px;
    background:var(--bg); border:1px solid var(--line-2); border-radius:10px;
    box-shadow:0 24px 60px #000a; display:flex; flex-direction:column;
    overflow:hidden; position:relative; }
  .titlebar { flex:none; display:flex; align-items:center; gap:8px;
    padding:7px 6px 7px 12px; background:#12141a; border-bottom:1px solid var(--line);
    font-size:12.5px; color:var(--dim); }
  .titlebar .nm { color:var(--txt); font-weight:500; }
  .titlebar .grow { flex:1; }
  .titlebar .wb { width:34px; height:24px; display:grid; place-items:center;
    border-radius:6px; cursor:default; color:var(--dim); font-size:13px; }
  .titlebar .wb.x:hover { background:#c0392b; color:#fff; cursor:pointer; }
  .winbody { flex:1; min-height:0; display:flex; }

  .closed { text-align:center; max-width:420px; }
  .closed h2 { margin:0 0 8px; font-size:17px; }
  .closed p { color:var(--dim); font-size:13px; }

  /* ------------------------------------------------- coque A : onglets --- */
  .shell-a { flex:1; min-width:0; display:flex; flex-direction:column; }
  .tabsbar { flex:none; display:flex; align-items:center; gap:14px;
    padding:0 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  .tabs { display:flex; gap:3px; }
  .tabs button { border:0; background:transparent; border-radius:0; padding:11px 14px;
    color:var(--dim); font-size:13.5px; border-bottom:2px solid transparent; }
  .tabs button:hover { background:#1c202a; color:var(--txt); }
  .tabs button.cur { color:var(--txt); border-bottom-color:var(--accent); background:transparent; }
  .tabsbar .grow { flex:1; }

  /* ------------------------------------------ coque B : colonne laterale - */
  .shell-b { flex:1; min-width:0; display:flex; }
  .rail { width:206px; flex:none; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; }
  .rail .brand { padding:13px 15px 11px; font-size:12px; letter-spacing:.9px;
    text-transform:uppercase; color:var(--faint); }
  .rail .items { padding:0 8px; display:flex; flex-direction:column; gap:2px; }
  .rail .items button { position:relative; border:0; background:transparent;
    border-radius:8px; padding:8px 11px; color:var(--dim);
    display:flex; align-items:center; gap:9px; }
  .rail .items button:hover { background:var(--raise); color:var(--txt); }
  .rail .items button.cur { background:var(--panel-2); color:var(--txt); }
  .rail .items button.cur:before { content:''; position:absolute; left:0; top:0; bottom:0;
    width:3px; background:var(--accent); }
  .rail .items .cnt { margin-left:auto; font:11px ui-monospace,monospace; color:var(--faint); }
  .rail .grow { flex:1; }

  /* ---------------------------------------------- coque C : accueil ------- */
  .shell-c { flex:1; min-width:0; display:flex; flex-direction:column; }
  .cbar { flex:none; display:flex; align-items:center; gap:10px; padding:9px 14px;
    background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; }
  .hub { flex:1; min-height:0; overflow:auto; padding:34px 26px 40px;
    display:flex; flex-direction:column; align-items:center; gap:22px; }
  .hero { width:min(660px,100%); background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:20px 22px; }
  .hero .lbl { font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    color:var(--faint); }
  .hero .big { font-size:23px; font-weight:600; margin:2px 0 3px; }
  .hero .sub { color:var(--dim); font-size:13px; }
  /* la liste plate de #7, servie a l'accueil : le pendant, dans la fenetre, du
     chip de l'Overlay retenu en #6. Le choix se fait donc a deux endroits. */
  .hublist { margin-top:13px; border-top:1px solid var(--line); padding-top:10px;
    display:flex; flex-direction:column; gap:2px; }
  .hublist button { display:flex; align-items:center; gap:9px; border:0;
    background:transparent; border-radius:8px; padding:6px 8px; font-size:13.5px; }
  .hublist button:hover { background:var(--raise); }
  .hublist button.cur { background:var(--panel-2); }
  .hublist .grow { flex:1; min-width:0; }
  .hublist .n { font:11px ui-monospace,monospace; color:var(--faint); }
  .doors { width:min(660px,100%); display:grid; grid-template-columns:repeat(3,1fr); gap:11px; }
  .door { background:var(--panel); border:1px solid var(--line); border-radius:13px;
    padding:15px 16px; }
  .door:hover { border-color:var(--accent); background:var(--panel-2); }
  .door b { display:block; font-size:14.5px; font-weight:600; color:var(--txt); }
  .door span { font-size:12px; color:var(--faint); }

  /* -------------------------------------------- l'interrupteur d'Affichage */
  .sw { display:inline-flex; align-items:center; gap:9px; cursor:pointer;
    background:transparent; border:0; padding:4px 2px; }
  .sw .track { width:40px; height:22px; flex:none; border-radius:11px; background:#2a2f3b;
    border:1px solid var(--line-2); position:relative; transition:.15s background; }
  .sw .track i { position:absolute; top:2px; left:2px; width:16px; height:16px;
    border-radius:50%; background:var(--faint); transition:.15s all; }
  .sw.on .track { background:#1d4a34; border-color:#2f7a54; }
  .sw.on .track i { left:20px; background:var(--ok); }
  .sw .cap { font-size:13px; color:var(--dim); }
  .sw:hover .cap { color:var(--txt); }
  /* le socle d'etat de la coque B : la Fenetre principale est le SEUL endroit
     ou l'app a le droit d'expliquer pourquoi rien n'apparait (l'ADR 0006 ne
     retire ce vocabulaire qu'a l'Overlay). */
  .socle { border-top:1px solid var(--line); padding:11px 14px 13px; }
  .socle .conds { margin-top:7px; display:flex; flex-direction:column; gap:3px; }
  .socle .conds div { font-size:11.5px; color:var(--faint); display:flex; gap:7px; }
  .socle .conds div.ok { color:#7d9c8b; }
  .socle .conds em { color:var(--faint); font-style:normal; width:11px; }
  .dot { width:7px; height:7px; border-radius:50%; flex:none;
    background:var(--faint); display:inline-block; }
  .dot.on { background:var(--ok); box-shadow:0 0 7px #3fc07a99; }
  .why { font-size:12px; color:var(--faint); }

  /* ------------------------------------------------------- ecran generique */
  main.scr { flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; }
  .scrhead { flex:none; display:flex; align-items:center; gap:12px;
    padding:13px 18px 11px; border-bottom:1px solid var(--line); }
  .scrhead h1 { margin:0; font-size:17px; font-weight:600; }
  .scrhead .grow { flex:1; }
  .scrbody { flex:1; min-height:0; overflow:auto; }
  .todo { padding:56px 26px; text-align:center; color:var(--faint); font-size:13px;
    line-height:1.7; }
  .todo b { color:var(--dim); }

  /* --------------------------------------------- liste des strats (commun) */
  .slist { padding:10px 14px 30px; }
  .srow { display:flex; align-items:center; gap:12px; padding:10px 12px;
    border:1px solid var(--line); border-radius:12px; background:var(--panel);
    margin-bottom:7px; }
  .srow:hover { border-color:var(--line-2); background:var(--panel-2); }
  .srow .nm { font-size:14.5px; font-weight:500; }
  .srow .meta { font-size:11.5px; color:var(--faint); }
  .srow .grow { flex:1; min-width:0; }
  .srow .acts { display:flex; gap:4px; opacity:0; transition:opacity .1s; }
  .srow:hover .acts, .srow.menu .acts { opacity:1; }
  .badge { font-size:10.5px; letter-spacing:.5px; text-transform:uppercase;
    color:var(--accent); border:1px solid #5b8cff55; border-radius:6px; padding:1px 6px; }
  .pick { width:17px; height:17px; flex:none; border-radius:50%; cursor:pointer;
    border:1px solid var(--line-2); background:#0c0e12; display:grid; place-items:center; }
  .pick.on { border-color:var(--accent); }
  .pick.on:after { content:''; width:9px; height:9px; border-radius:50%; background:var(--accent); }
  /* la composition en une rangee : c'est ce qui distingue deux strats plus
     vite qu'un nom, et le seul resume qu'un Emplacement autorise (ADR 0003 :
     ni libelle, ni pseudo — une classe et une Couleur). */
  .compostrip { display:flex; gap:3px; flex:none; }
  .menupop { position:absolute; z-index:40; background:var(--panel-2);
    border:1px solid var(--line-2); border-radius:10px; padding:4px;
    box-shadow:0 14px 34px #000b; display:flex; flex-direction:column; gap:2px; min-width:172px; }
  .menupop button { border:0; background:transparent; border-radius:7px; padding:6px 9px;
    font-size:13px; }
  .menupop button:hover { background:var(--raise); }
  .menupop .sepline { height:1px; background:var(--line); margin:3px 2px; }

  /* --------------------------------------------- l'etat « aucune Strat » -- */
  .nostrat { padding:60px 26px; display:flex; flex-direction:column; align-items:center;
    gap:14px; text-align:center; }
  .nostrat h2 { margin:0; font-size:19px; font-weight:600; }
  .nostrat p { margin:0; max-width:430px; color:var(--dim); font-size:13px; }
  .nostrat .cta { font-size:15px; padding:10px 20px; border-color:var(--accent);
    background:#22304d; text-align:center; }
  .nostrat .cta:hover { background:#2b3d62; }
  .nostrat .adr { font-size:11.5px; color:var(--faint); max-width:430px; }

  /* ------------------------------------------- l'editeur, tel que #5 le fige */
  .ed { flex:1; min-height:0; display:flex; }
  .compo { width:150px; flex:none; border-right:1px solid var(--line);
    background:var(--panel); display:flex; flex-direction:column; }
  .compo h2 { margin:0; padding:13px 14px 10px; font-size:11.5px; letter-spacing:1px;
    text-transform:uppercase; color:var(--dim); }
  .compo h2 span { color:var(--faint); letter-spacing:0; }
  .slots { padding:0 10px 10px; overflow:auto; }
  .slot { display:flex; align-items:center; gap:8px; padding:6px 7px; margin-bottom:7px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:11px; cursor:grab; }
  .slot .rank { width:16px; flex:none; color:var(--faint);
    font:700 11px/1 ui-monospace,monospace; text-align:center; }
  .compo .frozen { padding:0 14px 14px; font-size:11px; color:var(--faint); line-height:1.45; }
  .cls { display:flex; align-items:stretch; flex:none; }
  .cls .edge { width:3px; flex:none; background:var(--c,transparent); }
  .cls img { width:32px; height:32px; display:block; background:#0c0e12;
    box-shadow:0 0 0 1px #ffffff14 inset; }
  .cls.sm img { width:24px; height:24px; }
  .cls.xs .edge { width:3px; }
  .cls.xs img { width:26px; height:26px; }

  .turns { flex:1; min-width:0; overflow:auto; padding:16px 18px 40px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    margin-bottom:12px; overflow:hidden; width:var(--cardw,auto); max-width:620px; }
  .card > header { display:flex; align-items:center; gap:12px; padding:10px 14px;
    background:linear-gradient(#1e2330,#1a1e28); border-bottom:1px solid var(--line); }
  .tnum { flex:none; min-width:34px; height:30px; padding:0 7px; border-radius:9px;
    background:#0c0e12; border:1px solid var(--line-2); color:var(--accent);
    font:700 14px/28px ui-monospace,monospace; text-align:center; }
  .card > header .glob { flex:1; font-weight:500; }
  .rows { padding:6px 0; }
  .row { display:flex; align-items:center; gap:11px; padding:7px 14px 7px 11px; }
  .row + .row { border-top:1px solid #202531; }
  .row .cons { flex:1; min-height:24px; padding:2px 0; }
  .row .cons.vide { color:var(--faint); font-style:italic; }
  .note { display:flex; gap:8px; align-items:baseline; padding:7px 18px 7px 14px;
    background:#15161c; border-top:1px dashed var(--line-2); }
  .note .arrow { color:var(--note); font-size:12px; }
  .note .txt { flex:1; font-style:italic; color:var(--note); min-height:20px; }
  .addturn { width:100%; max-width:620px; padding:11px; border-style:dashed;
    color:var(--dim); text-align:center; }
  .ed.ro .card { opacity:.97; }
  .ro-flag { display:inline-flex; align-items:center; gap:6px; font-size:11.5px;
    color:var(--faint); border:1px solid var(--line); border-radius:6px; padding:1px 7px; }

  /* ----------------------------------------------- variante 2 : deux volets */
  .twopane { flex:1; min-height:0; display:flex; }
  .pane-l { width:216px; flex:none; border-right:1px solid var(--line);
    background:var(--panel); display:flex; flex-direction:column; }
  .pane-l .hd { padding:11px 12px 8px; font-size:11.5px; letter-spacing:1px;
    text-transform:uppercase; color:var(--faint); display:flex; align-items:center; gap:6px; }
  .pane-l .hd .grow { flex:1; }
  .pane-l .lst { overflow:auto; padding:0 7px 8px; }
  .pane-l .it { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:9px;
    cursor:pointer; }
  .pane-l .it:hover { background:var(--raise); }
  .pane-l .it { position:relative; }
  .pane-l .it.cur { background:var(--panel-2); }
  .pane-l .it.cur:before { content:''; position:absolute; left:0; top:0; bottom:0;
    width:3px; background:var(--accent); }
  .pane-l .it .nm { flex:1; min-width:0; font-size:13.5px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .pane-l .it .n { font:11px ui-monospace,monospace; color:var(--faint); }
  .pane-r { flex:1; min-width:0; display:flex; flex-direction:column; }
  .pane-r .hd { flex:none; display:flex; align-items:center; gap:10px;
    padding:9px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .pane-r .hd .grow { flex:1; }
  #edname { font-size:16px; font-weight:600; width:220px; background:transparent;
    border:0; border-bottom:1px solid var(--line-2); border-radius:0; padding:2px; }
  #edname:focus { border-bottom-color:var(--accent); }

  /* ------------------------------------------- variante 3 : blocs depliables */
  .blocks { padding:12px 14px 34px; }
  .blk { border:1px solid var(--line); border-radius:13px; background:var(--panel);
    margin-bottom:9px; overflow:hidden; }
  .blk.open { border-color:var(--line-2); }
  .blk > .bh { display:flex; align-items:center; gap:11px; padding:10px 13px; cursor:pointer; }
  .blk > .bh:hover { background:var(--panel-2); }
  .blk > .bh .chev { color:var(--dim); font-size:13px; width:13px; flex:none; }
  .blk > .bh .grow { flex:1; min-width:0; }
  .blk > .bh .acts { display:flex; gap:4px; opacity:0; }
  .blk:hover > .bh .acts, .blk.open > .bh .acts { opacity:1; }
  .blk .body { border-top:1px solid var(--line); background:#13161c; }
  .blk .rdbar { display:flex; align-items:center; gap:10px; padding:8px 14px;
    border-bottom:1px solid var(--line); font-size:12px; color:var(--faint); }
  .blk .rdbar .grow { flex:1; }
  .blk .fiches { padding:13px 14px 16px; display:flex; flex-wrap:wrap; gap:11px;
    align-items:flex-start; }
  .blk .fiches .card { margin:0; width:330px; max-width:none; }
  .blk .fiches .card .cons { font-size:13px; }
  .blk .ednested { display:flex; min-height:340px; }

  /* ------------------------------------------------------------ onboarding */
  .ob { flex:1; min-height:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; padding:30px; }
  .ob .sheet { width:min(600px,100%); background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:26px 28px 22px; }
  .ob .step { font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--faint); }
  .ob h2 { margin:4px 0 10px; font-size:20px; }
  .ob p { color:var(--dim); font-size:13.5px; margin:0 0 8px; }
  .ob .filler { font-size:11.5px; color:var(--faint); border-left:2px solid var(--line-2);
    padding-left:9px; margin-top:14px; }
  .ob .nav { display:flex; align-items:center; gap:8px; margin-top:20px; }
  .ob .nav .grow { flex:1; }
  .ob .dots { display:flex; gap:5px; }
  .ob .dots i { width:7px; height:7px; border-radius:50%; background:#333a48; }
  .ob .dots i.on { background:var(--accent); }

  /* --------------------------------------------------------- confirmations */
  .scrim { position:absolute; inset:0; background:#000000a8; display:grid;
    place-items:center; z-index:60; }
  .dlg { width:min(430px,92%); background:var(--panel-2); border:1px solid var(--line-2);
    border-radius:14px; padding:19px 21px 16px; box-shadow:0 20px 50px #000c; }
  .dlg h3 { margin:0 0 8px; font-size:16px; }
  .dlg p { margin:0 0 7px; font-size:13px; color:var(--dim); }
  .dlg .count { color:var(--txt); }
  .dlg .warn { color:var(--note); font-size:12.5px; }
  .dlg .acts { display:flex; gap:8px; justify-content:flex-end; margin-top:15px; }

  /* --------------------------------------------------------------- la barre */
  .dock { flex:none; background:#0c0e12; border-top:1px solid var(--line);
    padding:7px 12px 8px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    font-size:12px; }
  .dock .grp { display:flex; align-items:center; gap:5px; }
  .dock .grp > label { color:var(--faint); font-size:11px; letter-spacing:.5px;
    text-transform:uppercase; margin-right:2px; }
  .dock button { padding:3px 9px; font-size:12px; }
  .dock button.on { border-color:var(--accent); background:#22304d; }
  .dock .cyc { display:flex; align-items:center; gap:3px; }
  .dock .cyc .lab { min-width:236px; color:var(--txt); font-size:12px; }
  .dock .sep { width:1px; height:22px; background:var(--line); }
  .dock .grow { flex:1; }
  .dock .st { color:var(--faint); font:11.5px ui-monospace,monospace; }
  .dock .st b { color:var(--ok); font-weight:600; }
  .dock .st b.no { color:var(--faint); }
  details.state { flex:none; border-top:1px solid var(--line); background:var(--panel);
    padding:6px 14px; font-size:12px; }
  details.state summary { cursor:pointer; color:var(--dim); }
  details.state pre { max-height:200px; overflow:auto; color:#a9b2c2; font-size:11.5px; }
</style>

const nid = () => 'x' + (++uid);

// Emplacements : une classe + une Couleur, rien d'autre (ADR 0003).
function mkSlots(keys) {
  return keys.map((k, i) => ({ id:nid(), cls:KEYS.indexOf(k), couleur:SLOT_COLORS[i] }));
}
function mkStrat(nom, keys, tours) {
  const emplacements = mkSlots(keys);
  return { id:nid(), nom, emplacements,
    tours:(tours||[]).map(([global, cells, note]) => ({
      global, note:note||'',
      consignes:Object.fromEntries(Object.entries(cells||{})
        .map(([i,v]) => [emplacements[+i].id, v])) })) };
}

/* ================================================================ etat ==== */
const strat = id => S.strats.find(s => s.id === id);
const choisie = () => S.choisieId ? strat(S.choisieId) : null;
// Les trois conditions de CONTEXT.md, dans l'ordre ou l'utilisateur peut les
// corriger. La Fenetre principale a le droit de les nommer ; l'Overlay non.
function conditions() {
  return [
    { ok:S.affichageDemande, txt:"l'Affichage est demandé" },
    { ok:S.wakfuLance,       txt:'une fenêtre de Wakfu existe' },
    { ok:!!S.choisieId,      txt:'une Strat est choisie' },
  ];
}
const overlayDessine = () => conditions().every(c => c.ok);
function manque() {
  const k = conditions().find(c => !c.ok);
  return k ? k.txt : null;
}
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const plur = (n, s) => n + ' ' + s + (n > 1 ? 's' : '');

/* ============================================================ fragments === */
const clsHTML = (slot, size) =>
  `<span class="cls ${size||''}"><span class="edge" style="--c:${slot.couleur}"></span>` +
  `<img src="${ICONS[slot.cls]}" alt="${esc(CLASSES[slot.cls])}" title="${esc(CLASSES[slot.cls])}"></span>`;

const compostripHTML = st =>
  `<span class="compostrip">${st.emplacements.map(e => clsHTML(e,'xs')).join('')}</span>`;

const metaHTML = st => `${plur(st.tours.length,'tour')} · ${plur(st.emplacements.length,'emplacement')}`;

// La fiche de Tour, telle que #5 la fige. Reproduite, pas proposee.
function ficheHTML(st, i, editable) {
  const t = st.tours[i];
  return `<div class="card">
    <header><span class="tnum">T${i+1}</span>
      <span class="glob" ${editable?'contenteditable data-ph="description du tour…"':''}
        >${esc(t.global)}</span></header>
    <div class="rows">${st.emplacements.map(e => {
      const c = t.consignes[e.id];
      return `<div class="row">${clsHTML(e,'sm')}<div class="cons ${c?'':'vide'}"
        ${editable?'contenteditable data-ph="consigne…"':''}
        >${c ? esc(c) : (editable ? '' : '—')}</div></div>`;
    }).join('')}</div>
    ${(t.note || editable) ? `<div class="note"><span class="arrow">↳</span>
      <div class="txt" ${editable?'contenteditable data-ph="note libre…"':''}
        >${esc(t.note)}</div></div>` : ''}
  </div>`;
}

// L'editeur de #5 : colonne de composition a gauche (son ordre EST le Rang),
// fiches de Tour a droite.
function editeurHTML(st, editable) {
  return `<div class="ed ${editable?'':'ro'}">
    <aside class="compo">
      <h2>Composition <span>${st.emplacements.length}/6</span></h2>
      <div class="slots">${st.emplacements.map((e,i) =>
        `<div class="slot"><span class="rank">${i+1}</span>${clsHTML(e)}</div>`).join('')}</div>
      <p class="frozen">L'ordre de la colonne est le <b>Rang</b>. Cet intérieur est
        figé par #5 : il est reproduit ici comme décor, pas rejugé.</p>
    </aside>
    <section class="turns">
      ${st.tours.length
        ? st.tours.map((_,i) => ficheHTML(st,i,editable)).join('')
        : `<p class="why" style="padding:8px 2px 14px">Aucun Tour. L'Overlay
             dessinerait quand même la fiche <b>T1</b> et ses lignes vides (#18).</p>`}
      ${editable ? `<button class="addturn">＋ Ajouter un tour</button>` : ''}
    </section>
  </div>`;
}

const swHTML = (cap) => `<button class="sw ${S.affichageDemande?'on':''}" data-act="switch">
  <span class="track"><i></i></span><span class="cap">${cap||'Afficher l\'overlay'}</span></button>`;

/* ====================================================== les trois coques == */
const ECRANS = [['strats','Strats'],['roster','Roster'],['reglages','Réglages']];

/* ---- A : des onglets en haut. La coque la moins chere, et celle qui n'a
     AUCUNE place pour expliquer pourquoi l'overlay ne se dessine pas : la barre
     porte deja la navigation. L'onboarding y est donc un MUR : il masque les
     onglets, parce qu'il n'a nulle part ailleurs ou vivre. */
function coqueA() {
  if (S.ecran === 'onboarding') return `<div class="shell-a">${onboardingHTML()}</div>`;
  const d = overlayDessine();
  return `<div class="shell-a">
    <div class="tabsbar">
      <div class="tabs">${ECRANS.map(([k,l]) =>
        `<button data-act="nav:${k}" class="${S.ecran===k?'cur':''}">${l}</button>`).join('')}</div>
      <div class="grow"></div>
      <span class="why">${d ? '' : (S.affichageDemande ? 'il manque : '+manque() : '')}</span>
      ${swHTML()}
      <span class="dot ${d?'on':''}" title="${d?'l\'overlay est dessiné':'l\'overlay n\'est pas dessiné'}"></span>
      <button class="ghost" data-act="nav:onboarding" title="Revoir la prise en main">?</button>
    </div>
    ${ecranHTML()}
  </div>`;
}

/* ---- B : une colonne laterale, et un SOCLE D'ETAT en pied. La colonne rend
     une place permanente que les onglets n'ont pas : l'interrupteur y tient
     avec ses trois conditions ecrites. L'ADR 0006 ne retire le vocabulaire du
     doute qu'a l'Overlay ; la Fenetre principale est justement l'endroit ou #18
     comptait sur l'utilisateur pour « voir pourquoi rien n'apparait ». */
function coqueB() {
  const d = overlayDessine();
  const st = choisie();
  return `<div class="shell-b">
    <nav class="rail">
      <div class="brand">Wakfu Mémo</div>
      <div class="items">
        ${ECRANS.map(([k,l]) => `<button data-act="nav:${k}" class="${S.ecran===k?'cur':''}">
          ${l}${k==='strats'?`<span class="cnt">${S.strats.length}</span>`:''}</button>`).join('')}
        <button data-act="nav:onboarding" class="${S.ecran==='onboarding'?'cur':''}">Prise en main</button>
      </div>
      <div class="grow"></div>
      <div class="socle">
        ${swHTML()}
        <div class="conds">${conditions().map(c =>
          `<div class="${c.ok?'ok':''}"><em>${c.ok?'✓':'·'}</em>${c.txt}</div>`).join('')}</div>
        <p class="why" style="margin:9px 0 0">${d
          ? `L'overlay est dessiné, sur <b>${esc(st.nom)}</b>.`
          : `L'overlay n'est pas dessiné.`}</p>
      </div>
    </nav>
    ${ecranHTML()}
  </div>`;
}

/* ---- C : aucune navigation permanente. On ouvre cette app pour basculer un
     interrupteur ou changer de strat, puis on alt-tab. L'accueil est donc
     l'ETAT, et tout le reste est une porte. Le pari : ce qu'on vient chercher
     est sur l'accueil, et le prix est un niveau de plus pour le reste. */
function coqueC() {
  if (S.ecran === 'onboarding' && !S.strats.length)
    return `<div class="shell-c">${onboardingHTML()}</div>`;
  if (S.ecran !== 'accueil') {
    const lbl = { strats:'Strats', roster:'Roster', reglages:'Réglages',
                  onboarding:'Prise en main' }[S.ecran];
    return `<div class="shell-c">
      <div class="cbar"><button class="ghost" data-act="nav:accueil">‹ Accueil</button>
        <span style="color:var(--dim)">${lbl}</span></div>
      ${ecranHTML()}
    </div>`;
  }
  const d = overlayDessine(), st = choisie();
  return `<div class="shell-c"><div class="hub">
    <div class="hero">
      <div class="lbl">Strat choisie</div>
      <div class="big">${st ? esc(st.nom) : 'aucune'}</div>
      <div class="sub" style="display:flex;align-items:center;gap:10px">${st
        ? `${metaHTML(st)} ${compostripHTML(st)}
           <button class="ghost" data-act="hubpick" style="font-size:12px">changer ▾</button>`
        : `L'overlay ne se dessinera pas tant qu'aucune Strat n'est choisie.`}</div>
      ${S.hubPick ? `<div class="hublist">${S.strats.map(o =>
        `<button data-act="choose:${o.id}" class="${o.id===S.choisieId?'cur':''}">
          <span class="pick ${o.id===S.choisieId?'on':''}"></span>
          <span class="grow">${esc(o.nom)}</span>
          ${compostripHTML(o)}
          <span class="n">${o.tours.length}</span></button>`).join('')}</div>` : ''}
      <div style="display:flex;align-items:center;gap:14px;margin-top:17px;
                  padding-top:15px;border-top:1px solid var(--line)">
        ${swHTML('Afficher l\'overlay par-dessus le jeu')}
        <div class="grow" style="flex:1"></div>
        <span class="dot ${d?'on':''}"></span>
        <span class="why">${d ? "l'overlay est dessiné"
          : (S.affichageDemande ? 'il manque : '+manque() : 'overlay masqué')}</span>
      </div>
    </div>
    <div class="doors">
      <button class="door" data-act="nav:strats"><b>Strats</b>
        <span>${plur(S.strats.length,'strat')} · créer, relire, dupliquer</span></button>
      <button class="door" data-act="nav:roster"><b>Roster</b>
        <span>mes personnages, et les demandes d'ajout</span></button>
      <button class="door" data-act="nav:reglages"><b>Réglages</b>
        <span>opacité, raccourci, taille du texte</span></button>
    </div>
    <button class="ghost" data-act="nav:onboarding" style="font-size:12.5px">Revoir la prise en main</button>
  </div></div>`;
}

/* ============================================================== ecrans ==== */
function ecranHTML() {
  if (S.ecran === 'onboarding') return `<main class="scr">${onboardingHTML()}</main>`;
  if (S.ecran === 'roster' || S.ecran === 'reglages') {
    const n = S.ecran === 'roster' ? 22 : 23;
    const t = S.ecran === 'roster' ? 'Roster' : 'Réglages';
    return `<main class="scr"><div class="scrhead"><h1>${t}</h1></div>
      <div class="scrbody"><div class="todo">
        Écran <b>volontairement vide</b> : il appartient au ticket <b>#${n}</b>.<br>
        Le maquetter ici le préjugerait. Cette coque doit seulement montrer
        <b>qu'on y va</b>, et à quel prix en gestes.
      </div></div></main>`;
  }
  return stratsHTML();
}

/* ================================================= l'ecran des Strats ===== */
function stratsHTML() {
  if (!S.strats.length) return `<main class="scr">
    <div class="scrhead"><h1>Strats</h1></div>
    <div class="scrbody">${aucuneStratHTML()}</div></main>`;
  return { '1':strats1, '2':strats2, '3':strats3 }[S.variante]();
}

/* ---- l'etat « aucune Strat » : premier lancement, rien a afficher. C'est le
     seul ecran qui peut donner envie d'en creer une, l'ADR 0006 interdisant a
     l'Overlay de se dessiner sans Strat choisie. */
function aucuneStratHTML() {
  return `<div class="nostrat">
    <h2>Aucune strat</h2>
    <p>Une strat, c'est le plan d'un donjon : jusqu'à six emplacements, et une
       fiche par tour qui dit à chacun ce qu'il fait.</p>
    <button class="cta" data-act="create">Créer ma première strat</button>
    <p class="adr">Tant qu'aucune strat n'est choisie, l'overlay ne se dessine pas —
       même si l'affichage est demandé.</p>
  </div>`;
}

/* ---- 1 : liste plein ecran, puis DESCENTE. Renommer se fait sur place dans la
     liste ; dupliquer et supprimer sont dans le menu de la ligne ; choisir est
     une pastille a gauche, donc choisir n'oblige pas a ouvrir. Relire = ouvrir
     et derouler l'editeur, avec le risque d'editer par megarde. */
function strats1() {
  if (S.ouverteId && strat(S.ouverteId)) {
    const st = strat(S.ouverteId);
    return `<main class="scr">
      <div class="scrhead">
        <button class="ghost" data-act="back">‹ Toutes les strats</button>
        <h1>${esc(st.nom)}</h1>
        ${S.choisieId===st.id ? '<span class="badge">choisie</span>'
          : `<button class="ghost" data-act="choose:${st.id}">Utiliser cette strat</button>`}
        <div class="grow"></div>
        <button class="ghost" data-act="dup:${st.id}">Dupliquer</button>
        <button class="ghost danger" data-act="del:${st.id}">Supprimer</button>
      </div>
      <div class="scrbody" style="display:flex">${editeurHTML(st,true)}</div></main>`;
  }
  return `<main class="scr">
    <div class="scrhead"><h1>Strats</h1>
      <span class="why">${plur(S.strats.length,'strat')} · liste plate, noms libres</span>
      <div class="grow"></div>
      <button data-act="create">＋ Nouvelle strat</button></div>
    <div class="scrbody"><div class="slist">
      ${S.strats.map(st => `<div class="srow">
        <span class="pick ${S.choisieId===st.id?'on':''}" data-act="choose:${st.id}"
          title="utiliser cette strat"></span>
        <div class="grow" data-act="open:${st.id}" style="cursor:pointer">
          ${S.renommeId===st.id
            ? `<input class="ren" data-id="${st.id}" value="${esc(st.nom)}" autofocus>`
            : `<div class="nm">${esc(st.nom)}</div>`}
          <div class="meta">${metaHTML(st)}</div>
        </div>
        ${compostripHTML(st)}
        <div class="acts">
          <button class="ghost" data-act="open:${st.id}">Ouvrir</button>
          <button class="ghost" data-act="menu:${st.id}">⋯</button>
        </div>
      </div>`).join('')}
    </div></div></main>`;
}

/* ---- 2 : DEUX VOLETS. Un clic change de strat, sans retour en arriere — c'est
     la variante qui rend la comparaison la moins chere. En echange, « la strat
     selectionnee » et « la Strat choisie » deviennent deux choses differentes,
     et un seul clic ne peut pas dire les deux : d'ou le bouton explicite.
     Note : l'editeur de #5 possede DEJA une colonne a gauche, donc cette
     variante en aligne deux — trois avec la coque B. */
function strats2() {
  const st = strat(S.ouverteId) || S.strats[0];
  S.ouverteId = st.id;
  return `<main class="scr"><div class="twopane">
    <aside class="pane-l">
      <div class="hd"><span>Mes strats</span><div class="grow"></div>
        <button class="ghost" data-act="create" title="nouvelle strat">＋</button></div>
      <div class="lst">${S.strats.map(o => `<div class="it ${o.id===st.id?'cur':''}"
        data-act="open:${o.id}">
        <span class="pick ${S.choisieId===o.id?'on':''}" data-act="choose:${o.id}"
          title="utiliser cette strat"></span>
        <span class="nm">${esc(o.nom)}</span><span class="n">${o.tours.length}</span></div>`).join('')}
      </div>
    </aside>
    <section class="pane-r">
      <div class="hd">
        <input id="edname" class="ren" data-id="${st.id}" value="${esc(st.nom)}" spellcheck="false">
        ${S.choisieId===st.id ? '<span class="badge">choisie</span>'
          : `<button class="ghost" data-act="choose:${st.id}">Utiliser cette strat</button>`}
        <div class="grow"></div>
        <button class="ghost" data-act="dup:${st.id}">Dupliquer</button>
        <button class="ghost danger" data-act="del:${st.id}">Supprimer</button>
      </div>
      ${editeurHTML(st,true)}
    </section>
  </div></main>`;
}

/* ---- 3 : la liste EST la relecture. Chaque strat est un bloc ; deplie, il
     montre ses Tours en LECTURE SEULE, cote a cote — c'est la reponse la plus
     directe a #18 (« relire une strat se fait dans l'application »), et la
     seule variante ou lire n'est pas editer. « Modifier » bascule le bloc en
     editeur sur place. Deux blocs peuvent etre ouverts en meme temps. */
function strats3() {
  return `<main class="scr">
    <div class="scrhead"><h1>Strats</h1>
      <span class="why">déplier une strat la relit ; « modifier » l'ouvre</span>
      <div class="grow"></div>
      <button data-act="create">＋ Nouvelle strat</button></div>
    <div class="scrbody"><div class="blocks">
    ${S.strats.map(st => {
      const open = S.deplies.has(st.id), edit = S.editionId === st.id;
      return `<div class="blk ${open?'open':''}">
        <div class="bh" data-act="open:${st.id}">
          <span class="pick ${S.choisieId===st.id?'on':''}" data-act="choose:${st.id}"
            title="utiliser cette strat"></span>
          <span class="chev">${open?'▾':'▸'}</span>
          <div class="grow">
            ${S.renommeId===st.id
              ? `<input class="ren" data-id="${st.id}" value="${esc(st.nom)}" autofocus>`
              : `<div class="nm" style="font-size:14.5px;font-weight:500">${esc(st.nom)}</div>`}
            <div class="meta" style="font-size:11.5px;color:var(--faint)">${metaHTML(st)}</div>
          </div>
          ${compostripHTML(st)}
          <div class="acts">
            <button class="ghost" data-act="rename:${st.id}">Renommer</button>
            <button class="ghost" data-act="dup:${st.id}">Dupliquer</button>
            <button class="ghost danger" data-act="del:${st.id}">Supprimer</button>
          </div>
        </div>
        ${open ? `<div class="body">
          <div class="rdbar">
            ${edit ? '<span class="ro-flag">édition</span>'
                   : '<span class="ro-flag">lecture seule</span>'}
            <div class="grow"></div>
            <button class="ghost" data-act="${edit?'read':'edit'}:${st.id}">${
              edit ? 'Terminer' : 'Modifier'}</button>
          </div>
          ${edit ? `<div class="ednested">${editeurHTML(st,true)}</div>`
                 : (st.tours.length
                    ? `<div class="fiches">${st.tours.map((_,i)=>ficheHTML(st,i,false)).join('')}</div>`
                    : `<div class="todo">Aucun tour. L'Overlay dessinerait
                        quand même la fiche <b>T1</b> et ses lignes vides (#18).</div>`)}

}

/* ========================================================== onboarding ==== */
/* #17 a gele la FORME, et a titre d'exemple : cinq ecrans, passable, rejouable.
   Les MOTS sont hors perimetre — ils s'ecrivent contre l'app finie. Ce qui se
   juge ici est donc uniquement OU l'onboarding vit dans la coque, et ce qu'il
   masque pendant qu'il parle. */
const OB = [
  ['Wakfu Mémo remplace le doc partagé',
   "Un overlay par-dessus le jeu qui dit, tour par tour, ce que chacun doit faire."],
  ['Il lit les logs, rien de plus',
   "L'état du combat est déduit des fichiers de log du client, en lecture seule. Aucune lecture mémoire, aucune injection."],
  ['Une strat, c\'est un donjon',
   "Jusqu'à six emplacements — une classe et une couleur — et une fiche par tour."],
  ['Le roster se remplit tout seul',
   "Au premier combat, l'app propose d'enregistrer les personnages qu'elle ne connaît pas."],
  ['Jouez en fenêtré',
   "L'overlay ne peut pas se dessiner au-dessus du plein écran exclusif. En fenêtré, il suit la fenêtre du jeu."],
];
function onboardingHTML() {
  const i = S.ob == null ? 0 : S.ob, [t,p] = OB[i];
  return `<div class="ob"><div class="sheet">
    <div class="step">Prise en main · ${i+1} / ${OB.length}</div>
    <h2>${esc(t)}</h2>
    <p>${esc(p)}</p>
    <p class="filler">Texte de remplissage assumé : #17 a mis la rédaction hors
      périmètre — les mots s'écrivent contre l'app finie. Seule la forme se juge.</p>
    <div class="nav">
      <button class="ghost" data-act="ob:skip">Passer</button>
      <div class="grow"></div>
      <div class="dots">${OB.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
      <div class="grow"></div>
      ${i>0?`<button class="ghost" data-act="ob:prev">Précédent</button>`:''}
      <button data-act="ob:next">${i===OB.length-1?'Terminer':'Suivant'}</button>
    </div>
  </div></div>`;
}

/* =================================================== la confirmation ====== */
/* #11 : la suppression d'une strat AFFICHE LE COMPTE DE CE QUI PART. Et un cas
   que le ticket ne posait pas : supprimer la strat CHOISIE deplace le choix,
   ou l'eteint — auquel cas l'overlay cesse de se dessiner sans rien dire. */
function dlgHTML() {
  const st = strat(S.aSupprimer);
  if (!st) return '';
  const estChoisie = S.choisieId === st.id;
  const reste = S.strats.filter(o => o.id !== st.id);
  return `<div class="scrim"><div class="dlg">
    <h3>Supprimer « ${esc(st.nom)} » ?</h3>
    <p><span class="count">${plur(st.tours.length,'tour')}</span> et
       <span class="count">${plur(st.emplacements.length,'emplacement')}</span> partent avec elle.</p>
    ${estChoisie ? `<p class="warn">${reste.length
      ? `C'est la strat choisie : le choix passera à « ${esc(reste[0].nom)} ».`
      : `C'est la strat choisie, et la dernière : plus aucune strat ne sera choisie,
         et l'overlay ne se dessinera plus.`}</p>` : ''}
    <div class="acts">
      <button class="ghost" data-act="canceldel">Annuler</button>
      <button class="danger" data-act="confirmdel">Supprimer</button>
    </div>
  </div></div>`;
}

function menuHTML() {
  if (!S.menuId || !S.menuXY) return '';
  const st = strat(S.menuId);
  if (!st) return '';
  return `<div class="menupop" style="left:${S.menuXY[0]}px;top:${S.menuXY[1]}px">
    <button data-act="rename:${st.id}">Renommer</button>
    <button data-act="dup:${st.id}">Dupliquer</button>
    <div class="sepline"></div>
    <button data-act="del:${st.id}">Supprimer…</button>
  </div>`;
}

/* ============================================================== rendu ===== */
function render() {
  const stage = document.getElementById('stage');
  if (!S.appOpen) {
    stage.innerHTML = `<div class="closed">
      <h2>L'application est fermée.</h2>
      <p>Les deux Overlays avec elle : « application normale, la fermer ferme tout »
         (#16, #17). Le ✕ n'existe que sur la Fenêtre principale.</p>
      <button data-act="relaunch" style="margin-top:10px">Relancer l'application</button></div>`;
  } else {
    const body = { A:coqueA, B:coqueB, C:coqueC }[S.coque]();
    stage.innerHTML = `<div class="win">
      <div class="titlebar"><span class="nm">Wakfu Mémo</span>
        <span>${choisie() ? '— '+esc(choisie().nom) : ''}</span>
        <div class="grow"></div>
        <span class="wb">─</span><span class="wb">▢</span>
        <span class="wb x" data-act="quit" title="quitte tout, Overlays compris">✕</span>
      </div>
      <div class="winbody">${body}</div>
      ${dlgHTML()}${menuHTML()}
    </div>`;
  }
  renderDock();
  dump();
  const ren = document.querySelector('input.ren[autofocus]');
  if (ren) { ren.focus(); ren.select(); }
}

const COQUES = { A:'A — onglets en haut', B:'B — colonne latérale + socle d\'état',

const VARS = { '1':'1 — liste, puis descente', '2':'2 — deux volets',
               '3':'3 — la liste est la relecture' };

function renderDock() {
  const d = overlayDessine();
  document.getElementById('dock').innerHTML = `
    <div class="grp cyc"><label>coque</label>
      <button data-act="cyc:coque:-1">←</button>
      <span class="lab">${COQUES[S.coque]}</span>
      <button data-act="cyc:coque:1">→</button></div>
    <div class="sep"></div>
    <div class="grp cyc"><label>strats</label>
      <button data-act="cyc:var:-1">↑</button>
      <span class="lab">${VARS[S.variante]}</span>
      <button data-act="cyc:var:1">↓</button></div>
    <div class="sep"></div>
    <div class="grp"><label>scénario</label>
      <button data-act="sc:plein" class="${S.strats.length>1?'on':''}">5 strats</button>
      <button data-act="sc:une" class="${S.strats.length===1?'on':''}">1 strat</button>
      <button data-act="sc:vide" class="${S.strats.length===0?'on':''}">premier lancement</button></div>
    <div class="sep"></div>
    <div class="grp">
      <button data-act="wakfu" class="${S.wakfuLance?'on':''}">Wakfu lancé</button>

    <div class="grow"></div>
    <span class="st">overlay : <b class="${d?'':'no'}">${d?'dessiné':'pas dessiné'}</b>${
      d?'':' · manque : '+(manque()||'—')}</span>`;
}

function dump() {
  document.getElementById('statedump').textContent =
`// strats.json — forme gelée par #11 (le Rang est la position, le numéro de Tour aussi)
${JSON.stringify({ schema:1, strats:S.strats.map(s => ({
  id:s.id, nom:s.nom,
  emplacements:s.emplacements.map(e => ({ id:e.id, classe:KEYS[e.cls], couleur:e.couleur })),
  tours:s.tours.map(t => ({ global:t.global||undefined, note:t.note||undefined,
    consignes:Object.fromEntries(Object.entries(t.consignes).filter(([,v])=>v)) })) })) }, null, 1)}

// reglages.json — les deux clés que CET écran touche. Noms de clés NON tranchés :
// #11 a gelé les trois fichiers, pas le détail de reglages.json.
${JSON.stringify({ stratChoisie:S.choisieId, affichageDemande:S.affichageDemande }, null, 1)}`;
}

/* ============================================================== gestes ==== */
// Dupliquer PROPOSE un nom, il ne l'impose pas : #11 a gelé que les noms ne
// sont pas uniques. « (copie) », puis « (copie 2) » — garder le nom identique
// reste légal, c'est juste un défaut inutile à proposer.
function nomDeCopie(nom) {
  const base = nom + ' (copie)';
  if (!S.strats.some(s => s.nom === base)) return base;
  for (let k = 2; ; k++) {
    const c = `${nom} (copie ${k})`;
    if (!S.strats.some(s => s.nom === c)) return c;
  }
}
function dupliquer(id) {
  const st = strat(id), i = S.strats.indexOf(st);
  const map = {};
  const copie = { id:nid(), nom:nomDeCopie(st.nom),
    emplacements:st.emplacements.map(e => { const n = { ...e, id:nid() }; map[e.id] = n.id; return n; }),
    tours:st.tours.map(t => ({ global:t.global, note:t.note,
      consignes:Object.fromEntries(Object.entries(t.consignes).map(([k,v]) => [map[k],v])) })) };
  S.strats.splice(i+1, 0, copie);
  // Le nom de la copie part en édition : on duplique pour ajuster, jamais pour
  // garder « (copie) ». En variante 1 on RESTE dans la liste — c'est le seul
  // endroit ou elle sait renommer.
  S.renommeId = copie.id;
  if (S.variante !== '1') S.ouverteId = copie.id;
  if (S.variante === '3') S.deplies.add(copie.id);
  return copie;
}
function creer() {
  const st = { id:nid(), nom:'Nouvelle strat', emplacements:[], tours:[] };
  S.strats.push(st);
  // La PREMIERE strat créée devient la strat choisie : sans ça l'utilisateur
  // vient de tout saisir et l'overlay ne dessine toujours rien (ADR 0006).
  if (!S.choisieId) S.choisieId = st.id;
  S.renommeId = st.id;
  if (S.variante !== '1') S.ouverteId = st.id;
  if (S.variante === '3') S.deplies.add(st.id);
  return st;
}
function supprimer(id) {
  const i = S.strats.findIndex(s => s.id === id);
  if (i < 0) return;
  S.strats.splice(i, 1);
  if (S.choisieId === id) S.choisieId = S.strats.length ? S.strats[0].id : null;
  if (S.ouverteId === id) S.ouverteId = S.strats.length ? S.strats[0].id : null;
  S.deplies.delete(id);
  if (S.editionId === id) S.editionId = null;
}

function apresScenario() {
  if (S.variante === '3' && S.choisieId) S.deplies.add(S.choisieId);
}
const SCEN = {
  plein: () => { S.strats = JEU_COMPLET(); S.choisieId = S.strats[0].id;
                 S.ouverteId = null; S.deplies.clear(); S.ob = null;
                 S.ecran = S.coque === 'C' ? 'accueil' : 'strats'; },
  une:   () => { S.strats = [JEU_COMPLET()[0]]; S.choisieId = S.strats[0].id;
                 S.ouverteId = null; S.deplies.clear(); S.ob = null;
                 S.ecran = S.coque === 'C' ? 'accueil' : 'strats'; },
  // Premier lancement : aucune strat, aucun choix, et l'onboarding s'ouvre —
  // c'est le seul moment de la vie de l'installation ou les deux coexistent.
  vide:  () => { S.strats = []; S.choisieId = null; S.ouverteId = null;
                 S.deplies.clear(); S.ecran = 'onboarding'; S.ob = 0; },
};

function goEcran(k) {
  S.ecran = k; S.menuId = null;
  if (k === 'onboarding') S.ob = 0;
  if (k === 'strats' && S.variante === '1') S.ouverteId = null;
}
function sortieOnboarding() {
  S.ob = null;
  S.ecran = S.coque === 'C' ? 'accueil' : 'strats';
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) { if (S.menuId) { S.menuId = null; render(); } return; }
  const [act, a, b] = el.dataset.act.split(':');
  ev.stopPropagation();
  if (act === 'cyc') {
    const dir = +b;
    if (a === 'coque') {
      const ks = ['A','B','C'];
      S.coque = ks[(ks.indexOf(S.coque) + dir + 3) % 3];
      if (S.coque === 'C' && S.ecran === 'strats' && !S.ouverteId) S.ecran = 'accueil';
      if (S.coque !== 'C' && S.ecran === 'accueil') S.ecran = 'strats';
    } else {
      const ks = ['1','2','3'];
      S.variante = ks[(ks.indexOf(S.variante) + dir + 3) % 3];
      S.ouverteId = S.variante === '1' ? null : (S.ouverteId || (S.strats[0]||{}).id);
      S.editionId = null;
      if (S.variante === '3' && !S.deplies.size && S.choisieId) S.deplies.add(S.choisieId);
    }
    syncURL();
  }
  else if (act === 'nav') goEcran(a);
  else if (act === 'back') { S.ouverteId = null; }
  else if (act === 'switch') S.affichageDemande = !S.affichageDemande;
  else if (act === 'wakfu') S.wakfuLance = !S.wakfuLance;
  else if (act === 'quit') S.appOpen = false;
  else if (act === 'relaunch') S.appOpen = true;
  else if (act === 'sc') { SCEN[a](); apresScenario(); }
  else if (act === 'choose') { S.choisieId = a; S.menuId = null; S.hubPick = false; }
  else if (act === 'hubpick') S.hubPick = !S.hubPick;
  else if (act === 'open') {
    S.menuId = null;
    if (S.variante === '3') {
      if (S.deplies.has(a)) { S.deplies.delete(a); if (S.editionId === a) S.editionId = null; }
      else S.deplies.add(a);
    } else S.ouverteId = a;
  }
  else if (act === 'edit') S.editionId = a;
  else if (act === 'read') S.editionId = null;
  else if (act === 'rename') { S.renommeId = a; S.menuId = null; }
  else if (act === 'dup') { dupliquer(a); S.menuId = null; }
  else if (act === 'del') { S.aSupprimer = a; S.menuId = null; }
  else if (act === 'canceldel') S.aSupprimer = null;
  else if (act === 'confirmdel') { if (S.aSupprimer) supprimer(S.aSupprimer); S.aSupprimer = null; }
  else if (act === 'create') creer();
  else if (act === 'menu') {
    if (S.menuId === a) S.menuId = null;
    else { S.menuId = a;
      const r = el.getBoundingClientRect(), w = el.closest('.win').getBoundingClientRect();
      S.menuXY = [Math.min(r.left - w.left - 130, w.width - 186), r.bottom - w.top + 4]; }
  }
  else if (act === 'ob') {
    if (a === 'skip') sortieOnboarding();
    else if (a === 'prev') S.ob = Math.max(0, (S.ob||0) - 1);
    else if (a === 'next') { if (S.ob >= OB.length - 1) sortieOnboarding(); else S.ob = (S.ob||0) + 1; }
  }
  render();
});

// Renommer : sur place, la ou la variante l'a place. Entree valide, Echap annule.
document.addEventListener('keydown', ev => {
  const inp = ev.target.closest('input.ren');
  if (inp) {
    if (ev.key === 'Enter') { strat(inp.dataset.id).nom = inp.value.trim() || 'Sans nom';
      S.renommeId = null; render(); }
    if (ev.key === 'Escape') { S.renommeId = null; render(); }
    return;
  }
  if (/^(INPUT|TEXTAREA)$/.test(ev.target.tagName) || ev.target.isContentEditable) return;
  const k = { ArrowLeft:['coque',-1], ArrowRight:['coque',1],
              ArrowUp:['var',-1], ArrowDown:['var',1] }[ev.key];
  if (!k) return;
  ev.preventDefault();
  document.querySelector(`[data-act="cyc:${k[0]}:${k[1]}"]`).click();
});
document.addEventListener('blur', ev => {
  const inp = ev.target.closest && ev.target.closest('input.ren');
  if (inp && strat(inp.dataset.id)) {
    strat(inp.dataset.id).nom = inp.value.trim() || 'Sans nom';
    if (S.renommeId) { S.renommeId = null; render(); }
  }
}, true);
// Les consignes sont editables pour que la densite soit vraie sous la main ;
// elles remontent au modele sans re-rendu, sinon le caret sauterait.
document.addEventListener('input', ev => {
  if (ev.target.isContentEditable) dump();
});

function syncURL() {
  const u = new URL(location);
  u.searchParams.set('coque', S.coque);
  u.searchParams.set('strats', S.variante);
  history.replaceState(null, '', u);
}
const q = new URLSearchParams(location.search);
if (['A','B','C'].includes((q.get('coque')||'').toUpperCase())) S.coque = q.get('coque').toUpperCase();
if (['1','2','3'].includes(q.get('strats'))) S.variante = q.get('strats');
// ?sc= sert a partager un etat de depart (premier lancement, une seule strat).
if (SCEN[q.get('sc')]) SCEN[q.get('sc')]();
if (S.coque === 'C') S.ecran = 'accueil';
if (S.variante !== '1') S.ouverteId = (S.strats[0]||{}).id; else S.ouverteId = null;
if (S.variante === '3' && S.choisieId) S.deplies.add(S.choisieId);
syncURL();
render();
</script>
</body>
